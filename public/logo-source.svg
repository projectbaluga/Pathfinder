<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D5DF6" />
      <stop offset="100%" stop-color="#4A3FE0" />
    </linearGradient>
  </defs>
  <!-- Background Gradient -->
  <rect width="1200" height="630" fill="url(#brand-grad)" />
  <!-- Circle Glow -->
  <circle cx="1000" cy="150" r="300" fill="#FFFFFF" opacity="0.05" />
  <!-- Logo Emblem -->
  <g transform="translate(100, 165)">
    <rect width="300" height="300" rx="60" fill="#FFFFFF" opacity="0.08" />
    <circle cx="150" cy="150" r="60" fill="none" stroke="#FBA919" stroke-width="32" />
    <path d="M90 90 L90 210" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round" />
    <path d="M90 150 L180 150" stroke="#FBA919" stroke-width="32" stroke-linecap="round" />
    <!-- Checkmark Badge -->
    <path d="M200 190 L240 230 L310 130" fill="none" stroke="#FBA919" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Typography Wordmark -->
  <text x="450" y="280" font-family="'Poppins', 'Inter', sans-serif" font-size="96" font-weight="800" fill="#FFFFFF" letter-spacing="-2">ProveIT</text>
  <text x="450" y="380" font-family="'Poppins', 'Inter', sans-serif" font-size="44" font-weight="600" fill="#FBA919">Prove your IT skills.</text>
  <text x="450" y="440" font-family="'Poppins', 'Inter', sans-serif" font-size="24" font-weight="500" fill="#EBE9FE" opacity="0.8">Directory • Reviewer • Practice Quizzes</text>
</svg>
